<div class="chatbot-container">
  <div class="chatbot-window" *ngIf="isOpen">
    <div class="chatbot-header">
      <div class="header-info">
        <span class="material-icons">smart_toy</span>
        <h3>Hỗ trợ WebBanHoaQua</h3>
      </div>
      <button class="close-btn" (click)="toggleChat()" aria-label="Đóng chatbot">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="chatbot-messages" #messageContainer>
      <div class="chat-message bot">
        Dạ vâng, xin chào anh/chị. Em là trợ lý của WebBanHoaQua, có thể hỗ trợ mọi thông tin về nội dung website, sản phẩm/khóa học, giá, khuyến mãi, cách đặt hàng và tra cứu đơn hàng ạ?
      </div>

      <div class="chat-suggestions" *ngIf="messages.length === 0 && !isTyping">
        <button *ngFor="let suggestion of suggestions" (click)="sendMessage(suggestion)">
          {{ suggestion }}
        </button>
      </div>

      <div
        *ngFor="let msg of messages"
        class="chat-message"
        [class.user]="msg.type === 'user'"
        [class.bot]="msg.type === 'bot'"
        [innerText]="msg.message">
      </div>

      <div class="typing-indicator" *ngIf="isTyping">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="chatbot-input">
      <input
        type="text"
        [(ngModel)]="userMessage"
        (keyup.enter)="sendMessage(userMessage)"
        placeholder="Nhập tin nhắn..."
        [disabled]="isTyping">
      <button (click)="sendMessage(userMessage)" [disabled]="!userMessage.trim() || isTyping" aria-label="Gửi tin nhắn">
        <span class="material-icons">send</span>
      </button>
    </div>
  </div>

  <button class="chatbot-toggle" (click)="toggleChat()" [class.open]="isOpen" aria-label="Mở chatbot">
    <span class="material-icons">{{ isOpen ? 'close' : 'chat' }}</span>
  </button>
</div>
